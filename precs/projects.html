    /* 프로젝트 카드 */
    .project-card {
      border-left: 4px solid #dee2e6;   /* 기본(참여) 과제 */
      transition: box-shadow .2s ease;
    }
    .project-card + .project-card { margin-top: 1.25rem; }
    .project-card:hover { box-shadow: 0 .5rem 1rem rgba(0,0,0,.10) !important; }

    /* 연구책임자 과제 강조 */
    .project-card.is-pi {
      border-left: 6px solid var(--bs-primary);
      background: rgba(39, 128, 227, .04);
    }
    .project-card.is-pi .project-title { font-weight: 700; }

    .project-title { font-weight: 600; line-height: 1.4; }
    .project-funder { color: #6c757d; }

    .badge-row { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
    .badge-row:not(:last-child) { margin-bottom: .5rem; }
    .project-period { font-variant-numeric: tabular-nums; }

    /* 역할 배지 */
    .badge-pi {
      background: var(--bs-primary);
      letter-spacing: .01em;
      box-shadow: 0 1px 3px rgba(39,128,227,.35);
    }
    .badge-role { background: #adb5bd; }

    .project-desc { font-size: .95rem; color: #495057; margin: .5rem 0 0; }

    /* 범례 */
    .legend { font-size: .875rem; color: #6c757d; display: flex; align-items: center; gap: .5rem; }
    .legend .swatch {
      display: inline-block;
      width: .75rem;
      height: .75rem;
      border-radius: 2px;
      background: var(--bs-primary);
    }

    @media (prefers-reduced-motion: reduce) {
      .project-card { transition: none; }
    }
  </style>
</head>

<!-- ===================================================================
     과제를 추가할 때는 PROJECTS 배열 맨 위에 객체 하나만 추가.
       { title, funder, period, pi: true, role: "...", tags: [...], desc: "..." }
     - pi: true      → 카드 강조 + '연구책임자 (PI)' 배지
     - role: "공동연구원" 등 → 회색 역할 배지 (pi 가 아닐 때만 사용)
     - role, desc 는 선택 항목
     ★ 각 속성 끝, 각 객체 끝의 쉼표(,)를 빠뜨리지 말 것
     =================================================================== -->
<script>
  const PROJECTS = [
    {
      title:  "멀티모달 통합 임베딩 및 자가 검증형 실시간 Agentic AI 기반 고신뢰 기업 공시 데이터 분석 기술 개발",
      funder: "생성AI 선도인재양성사업",
      period: "2026.04 – 2029.12",
      tags:   ["Generative AI", "Multimodal Embedding"]
    },
    {
      title:  "재난 피해 요인 해체 및 재조합 기반의 생성형 재난 데이터 구성과 선제적 피해 예측 기술",
      funder: "IITP 정보통신기획평가원 디지털콜럼버스프로젝트",
      period: "2026.04 – 2027.12",
      pi:     true,
      tags:   ["Learning-to-Rank", "Causal Inference", "Generative AI"]
    },
    {
      title:  "도메인 적응형 추천 전략 선택 자동화를 위한 지능형 에이전트 연구",
      funder: "한국연구재단 신진연구(유형A)",
      period: "2026.03 – 2028.02",
      pi:     true,
      tags:   ["Recommender Systems", "Agentic AI"]
    },
    {
      title:  "멀티모달 기반 로봇 특화 Embodied AI 선도 문제 해결과 인재양성",
      funder: "AI스타펠로우십지원사업",
      period: "2025.04 – 2030.12",
      tags:   ["Multimodal", "Robotics"]
      // desc: "Multimodal, robotics-focused Embodied AI: tackling foundational challenges and training next-generation experts."
    }
  ];
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const root = document.getElementById("projectRoot");

    function badge(text, cls) {
      const b = document.createElement("span");
      b.className = "badge " + cls;
      b.textContent = text;
      return b;
    }

    PROJECTS.forEach(function (p) {
      const card = document.createElement("div");
      card.className = "card project-card shadow-sm" + (p.pi ? " is-pi" : "");

      const body = document.createElement("div");
      body.className = "card-body";

      const title = document.createElement("h2");
      title.className = "card-title project-title h5 mb-2";
      title.textContent = p.title;
      body.appendChild(title);

      const funder = document.createElement("h3");
      funder.className = "card-subtitle project-funder h6 mb-3";
      funder.textContent = p.funder;
      body.appendChild(funder);

      // 역할 / 기간
      const meta = document.createElement("div");
      meta.className = "badge-row";
      if (p.pi) {
        meta.appendChild(badge("연구책임자 (PI)", "badge-pi"));
      } else if (p.role) {
        meta.appendChild(badge(p.role, "badge-role"));
      }
      const period = badge(p.period, "bg-light text-dark border");
      period.classList.add("project-period");
      meta.appendChild(period);
      body.appendChild(meta);

      // 키워드
      if (p.tags && p.tags.length) {
        const tags = document.createElement("div");
        tags.className = "badge-row";
        p.tags.forEach(function (t) { tags.appendChild(badge(t, "bg-success")); });
        body.appendChild(tags);
      }

      if (p.desc) {
        const desc = document.createElement("p");
        desc.className = "project-desc";
        desc.textContent = p.desc;
        body.appendChild(desc);
      }

      card.appendChild(body);
      root.appendChild(card);
    });
  });
</script>
</body>
