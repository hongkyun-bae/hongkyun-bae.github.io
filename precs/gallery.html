<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | PRecS Lab</title>
  <!-- Bootswatch Cosmo Theme -->
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/cosmo/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    /* 행사 제목 블록 */
    .event-head {
      border-bottom: 2px solid var(--bs-primary);
      padding-bottom: .5rem;
      margin-bottom: 1.25rem;
    }
    .event-headline {
      display: flex;
      align-items: baseline;
      gap: .75rem;
      flex-wrap: wrap;
    }
    .event-date {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--bs-primary);
      white-space: nowrap;
    }
    .event-title { font-weight: 600; margin: 0; }
    /* 논문 제목처럼 긴 메모는 제목 아랫줄에 */
    .event-note {
      display: block;
      font-size: .9rem;
      color: #6c757d;
      margin-top: .35rem;
      line-height: 1.45;
    }

    /* 썸네일: 사진 비율이 달라도 그리드가 흐트러지지 않게 */
    .photo-thumb {
      width: 100%;
      height: 200px;
      object-fit: cover;
      object-position: 50% 45%;
      border-radius: .375rem;
      cursor: zoom-in;
      box-shadow: 0 2px 8px rgba(0,0,0,.10);
      transition: transform .2s ease;
      display: block;
      background: #f1f3f5;
    }
    .photo-thumb:hover { transform: scale(1.03); }

    /* 확대 보기(모달) */
    #lightboxModal .modal-body { padding: 0; background: #000; }
    #lightboxModal img { width: 100%; height: auto; display: block; }

    @media (prefers-reduced-motion: reduce) {
      .photo-thumb { transition: none; }
      .photo-thumb:hover { transform: none; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <!-- px-3로 좌우 패딩 통일 -->
    <div class="container px-3">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="assets/images/kookmin_logo.png" alt="Kookmin University Logo" class="brand-logo">
        <span class="fw-semibold">PRecS Lab</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">Professor</a></li>
          <li class="nav-item"><a class="nav-link" href="members.html">Members</a></li>
          <li class="nav-item"><a class="nav-link" href="publications.html">Publications</a></li>
          <li class="nav-item"><a class="nav-link" href="patents.html">Patents</a></li>
          <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
          <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <header class="bg-light text-center py-5 border-bottom">
    <div class="container">
      <h1 class="fw-bold">Gallery</h1>
      <p class="lead mb-0">Moments from the PRecS Lab</p>
    </div>
  </header>

  <!-- Main -->
  <main class="container my-5" id="galleryRoot"></main>

  <!-- 확대 보기 모달 -->
  <div class="modal fade" id="lightboxModal" tabindex="-1" aria-labelledby="lightboxLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="lightboxLabel">Photo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <img id="lightboxImage" src="" alt="">
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-light text-center text-muted py-3">
    <div class="container">
      <small>© 2025 PRecS Lab | Kookmin University</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ===================================================================
         1) assets/images/gallery/ 에 사진 업로드
         2) 아래에 { date, title, note, dir, photos } 객체 추가
       배열 위쪽이 화면 위쪽 (최신순)
       =================================================================== -->
  <script>
    const EVENTS = [
      {
        date:   "2026.08.19",
        title:  "후기 학사학위수여식 (정민지, 송현우)",
        dir:    "assets/images/gallery",
        photos: ["260819_1.jpg", "260819_2.jpg"]
      },
      {
        date:   "2026.05.28",
        title:  "2026 캡스톤디자인발표 (정민지, 송현우, 이준성, 장대희, 한이연)",
        note:   "Context-Aware Personalized Citation Recommender System using SPECTER2 and Multi-Stage Ranking",
        dir:    "assets/images/gallery",
        photos: ["260528_1.jpg", "260528_3.jpg", "260528_2.jpg"]
      },
      {
        date:   "2026.01.30",
        title:  "한국소프트웨어종합학술대회 (KSC) 학부생/주니어 논문경진대회 장려상 수상 (정민지, 정민교)",
        note:   "RecPrompt++: 개인화된 셀프-튜닝 프롬프트 엔지니어링 기법을 이용한 효과적인 뉴스 추천 프레임워크",
        dir:    "assets/images/gallery",
        photos: ["260130_1.png", "260130_2.jpg", "260130_3.PNG"]
      },
      {
        date:   "2025.12.16",
        title:  "한국소프트웨어종합학술대회 (KSC) 신진연구자세션",
        note:   "도메인 특화 추천시스템을 위한 순위학습 (Learning-to-Rank) 기법의 적용과 발전",
        dir:    "assets/images/gallery",
        photos: ["251216_4.jpg", "251216_1.jpg", "251216_2.jpg", "251216_3.jpg"]
      },
      {
        date:   "2025.12.13",
        title:  "Korea-Japan Database Workshop (KJDB 2025)",
        note:   "Recommender Models are Ranking Learners: Domain-Specific Pairwise Learning-to-Rank Techniques for Recommender Systems",
        dir:    "assets/images/gallery",
        photos: ["251213_1.jpg", "251213_2.jpg", "251213_3.jpg", "251213_4.jpg"]
      },
      {
        date:   "2025.11.13",
        title:  "바이브컴퍼니 초청세미나 (VAIV Company)",
        note:   "Towards Autonomous Recommender Agents: Domain-Adaptive Learning-to-Rank Frameworks",
        dir:    "assets/images/gallery",
        photos: ["251113_1.jpg", "251113_2.jpg", "251113_3.jpg", "251113_4.jpg"]
      }
    ];
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const root = document.getElementById("galleryRoot");
      const modal = new bootstrap.Modal(document.getElementById("lightboxModal"));
      const modalImg = document.getElementById("lightboxImage");
      const modalLabel = document.getElementById("lightboxLabel");

      EVENTS.forEach(function (ev, i) {
        const section = document.createElement("div");
        section.className = i === EVENTS.length - 1 ? "" : "mb-5";

        // 제목 블록
        const head = document.createElement("div");
        head.className = "event-head";

        const headline = document.createElement("div");
        headline.className = "event-headline";
        const date = document.createElement("span");
        date.className = "event-date";
        date.textContent = ev.date;
        const title = document.createElement("h2");
        title.className = "event-title h5";
        title.textContent = ev.title;
        headline.append(date, title);
        head.appendChild(headline);

        if (ev.note) {
          const note = document.createElement("span");
          note.className = "event-note";
          note.textContent = ev.note;
          head.appendChild(note);
        }
        section.appendChild(head);

        // 사진 그리드
        const row = document.createElement("div");
        row.className = "row g-3";
        ev.photos.forEach(function (file, n) {
          const col = document.createElement("div");
          col.className = "col-6 col-md-4 col-lg-3";
          const img = document.createElement("img");
          img.className = "photo-thumb";
          img.src = ev.dir + "/" + file;
          img.alt = ev.title + " " + (n + 1);
          img.loading = "lazy";
          img.addEventListener("error", function () {
            // 파일명이 틀린 경우 콘솔에서 바로 확인할 수 있게
            console.warn("이미지를 찾을 수 없습니다:", img.src);
          });
          img.addEventListener("click", function () {
            modalImg.src = img.src;
            modalImg.alt = img.alt;
            modalLabel.textContent = ev.date + "  " + ev.title;
            modal.show();
          });
          col.appendChild(img);
          row.appendChild(col);
        });
        section.appendChild(row);

        root.appendChild(section);
      });
    });
  </script>
</body>
</html>
