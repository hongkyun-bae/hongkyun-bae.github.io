<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <!-- Bootswatch Cosmo Theme -->
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/cosmo/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    /* 섹션 제목 */
    .patent-group-title {
      font-weight: 700;
      border-bottom: 2px solid var(--bs-primary);
      padding-bottom: .5rem;
      margin-bottom: 1.75rem;
    }
    .patent-group-title .count {
      font-size: .9rem;
      font-weight: 500;
      color: #6c757d;
      margin-left: .5rem;
    }

    /* 특허 한 건 */
    .patent-item {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 1rem;
      padding: 1.25rem 0;
      border-bottom: 1px solid rgba(0,0,0,.08);
    }
    .patent-item:last-child { border-bottom: 0; }

    .patent-year {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--bs-primary);
      padding-top: .1rem;
    }
    .patent-country {
      display: block;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .04em;
      color: #6c757d;
      margin-top: .15rem;
    }

    .patent-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: .2rem;
    }
    .patent-title-en {
      color: #6c757d;
      font-size: .95rem;
      margin-bottom: .45rem;
    }
    .patent-inventors {
      font-size: .95rem;
      margin-bottom: .45rem;
    }
    .patent-inventors .me { font-weight: 700; }

    /* 번호·날짜 등 메타 정보 */
    .patent-meta {
      font-size: .875rem;
      color: #6c757d;
      display: flex;
      flex-wrap: wrap;
      gap: .35rem 1.25rem;
      margin-bottom: 0;
    }
    .patent-meta .label {
      color: #495057;
      font-weight: 600;
      margin-right: .3rem;
    }
    .patent-links { margin-top: .6rem; }
    .patent-links .btn { margin-right: .4rem; }

    @media (max-width: 575.98px) {
      .patent-item { grid-template-columns: 1fr; gap: .35rem; }
      .patent-country { display: inline; margin-left: .5rem; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="bg-light text-center py-5 border-bottom">
    <div class="container">
      <h1 class="fw-bold">Patents</h1>
      <p class="lead mb-0">Registered patents and pending applications</p>
    </div>

  <!-- Main : 특허 목록 -->
  <main class="container my-5" id="patentRoot"></main>

  <!-- Footer -->
  <footer class="bg-light text-center text-muted py-3">
    <div class="container">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ===================================================================

       status   : "registered"(등록) 또는 "pending"(출원 중)  ← 섹션이 나뉘는 기준
       country  : "KR" / "US" / "PCT" 등
       titleKo  : 국문 발명의 명칭 (없으면 생략 가능)
       titleEn  : 영문 명칭 (없으면 생략 가능)
       inventors: 발명자 배열. 이름 뒤에 *를 붙이면 굵게 표시됩니다.
       appNo/appDate : 출원번호 / 출원일
       regNo/regDate : 등록번호 / 등록일 (등록 특허만)
       assignee : 권리자(출원인)
       link     : KIPRIS·Google Patents 등 상세 링크 (없으면 생략)

       정렬 기준: 등록 특허는 등록일, 출원 특허는 출원일 최신순
       =================================================================== -->
  <script>
    const PATENTS = [
      {
        status:   "registered",
        country:  "US",
        titleEn:  "Method for Optimizing Performance of Algorithm Using Precision Scaling",
        inventors:["Yongjun Park", "Seokwon Kang", "Sang-Wook Kim", "Hong-Kyun Bae*", "Jae-Seo Yu", "Kyunghwan Choi"],
        regNo:    "11,537,395",
        regDate:  "2022.12.27",
        assignee: "Industry-University Cooperation Foundation Hanyang University",
        link:     ""
      },
      {
        status:   "registered",
        country:  "KR",
        titleKo:  "아이템 랭킹 승격 기반의 추천 방법 및 그 시스템",
        titleEn:  "Item-Ranking Promotion in Recommender Systems",
        inventors:["배홍균*", "장해리", "김상욱"],
        appNo:    "10-2023-0116956",
        appDate:  "2023.09.04",
        regNo:    "10-2995802",
        regDate:  "2026.07.22",
        assignee: "한양대학교 산학협력단",
        link:     ""
      },
      {
        status:   "registered",
        country:  "KR",
        titleKo:  "추천시스템에서의 효율적인 행렬 분해를 위한 양자화 프레임워크 장치 및 학습방법",
        titleEn:  "A Quantization Framework for Efficient Matrix Factorization in Recommender Systems",
        inventors:["유재서", "고윤용", "배홍균*", "박영준", "김상욱"],
        appNo:    "10-2021-0184046",
        appDate:  "2021.12.21",
        regNo:    "10-2921898",
        regDate:  "2026.01.29",
        assignee: "한양대학교 산학협력단",
        link:     ""
      },
      {
        status:   "registered",
        country:  "KR",
        titleKo:  "감정 요소가 결합된 지식 그래프와 강화학습을 이용한 설명 가능한 추천 시스템 및 방법",
        titleEn:  "Explainable Recommendation System and Method Incorporating Sentiment on Relations into Knowledge Graph and Reinforcement Learning",
        inventors:["박성준", "채동규", "배홍균*", "김상욱"],
        appNo:    "10-2021-0054841",
        appDate:  "2021.04.28",
        regNo:    "10-2633688",
        regDate:  "2023.11.29",
        assignee: "한양대학교 산학협력단",
        link:     ""
      },
      {
        status:   "registered",
        country:  "KR",
        titleKo:  "경쟁 프로그램 기반의 TV 프로그램 추천 방법 및 장치",
        titleEn:  "Method and Apparatus for Recommending TV Programs based on Competing Programs",
        inventors:["배홍균*", "이연창", "김상욱"],
        appNo:    "10-2020-0182547",
        appDate:  "2020.12.23",
        regNo:    "10-2372712",
        regDate:  "2021.12.16",
        assignee: "한양대학교 산학협력단",
        link:     ""
      },
      {
        status:   "registered",
        country:  "KR",
        titleKo:  "표준화된 평점 기반의 아이템 추천 방법 및 장치",
        titleEn:  "Method and Apparatus for Recommending Items based on Standardized Ratings",
        inventors:["배홍균*", "김형욱", "김상욱"],
        appNo:    "10-2018-0056888",
        appDate:  "2018.05.18",
        regNo:    "10-2200340",
        regDate:  "2021.01.04",
        assignee: "한양대학교 산학협력단",
        link:     ""
      }
    ];

    const GROUPS = [
      { key: "registered", title: "Registered Patents", subtitle: "등록 특허", sortBy: "regDate" },
      { key: "pending",    title: "Patent Applications", subtitle: "출원 특허", sortBy: "appDate" }
    ];
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const root = document.getElementById("patentRoot");

      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }

      function year(d) {
        return d ? String(d).slice(0, 4) : "";
      }

      function metaItem(label, value) {
        if (!value) return "";
        return '<span><span class="label">' + label + '</span>' + esc(value) + '</span>';
      }

      function renderItem(p, sortKey) {
        const el = document.createElement("article");
        el.className = "patent-item";

        // 왼쪽: 연도 + 국가
        const left = document.createElement("div");
        left.className = "patent-year";
        left.innerHTML = esc(year(p[sortKey])) +
          '<span class="patent-country">' + esc(p.country || "") + '</span>';

        // 오른쪽: 본문
        const body = document.createElement("div");
        let html = "";

        if (p.titleKo) html += '<p class="patent-title mb-1">' + esc(p.titleKo) + '</p>';
        if (p.titleEn) {
          html += '<p class="' + (p.titleKo ? 'patent-title-en' : 'patent-title') + '">' +
                  esc(p.titleEn) + '</p>';
        }

        if (p.inventors && p.inventors.length) {
          const names = p.inventors.map(function (n) {
            return n.endsWith("*")
              ? '<span class="me">' + esc(n.slice(0, -1)) + '</span>'
              : esc(n);
          }).join(", ");
          html += '<p class="patent-inventors">' + names + '</p>';
        }

        html += '<p class="patent-meta">' +
          metaItem("출원", [p.appNo, p.appDate].filter(Boolean).join(" · ")) +
          metaItem("등록", [p.regNo, p.regDate].filter(Boolean).join(" · ")) +
          metaItem("권리자", p.assignee) +
          '</p>';

        if (p.link) {
          html += '<div class="patent-links">' +
            '<a class="btn btn-sm btn-outline-primary" href="' + esc(p.link) +
            '" target="_blank" rel="noopener">상세 정보</a></div>';
        }

        body.innerHTML = html;
        el.append(left, body);
        return el;
      }

      GROUPS.forEach(function (g) {
        const items = PATENTS
          .filter(function (p) { return p.status === g.key; })
          .sort(function (a, b) {
            return String(b[g.sortBy] || "").localeCompare(String(a[g.sortBy] || ""));
          });

        if (!items.length) return;

        const section = document.createElement("section");
        section.className = "mb-5";

        const h2 = document.createElement("h2");
        h2.className = "patent-group-title h4";
        h2.innerHTML = esc(g.title) +
          '<span class="count">' + esc(g.subtitle) + ' · ' + items.length + '건</span>';
        section.appendChild(h2);

        items.forEach(function (p) {
          section.appendChild(renderItem(p, g.sortBy));
        });

        root.appendChild(section);
      });

      if (!root.children.length) {
        root.innerHTML = '<p class="text-muted text-center py-5 mb-0">등록된 특허 정보가 아직 없습니다.</p>';
      }
    });
  </script>
</body>
</html>
