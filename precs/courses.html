  <!-- Bootswatch Cosmo Theme -->
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/cosmo/bootstrap.min.css" rel="stylesheet"/>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/main.css"/>
  <style>
    /* 학기 라벨 1열 + 과목 N열의 표 구조.
       한 개의 grid 안에 모든 학기가 들어가므로 과목명 열이 서로 정렬됩니다. */
    .course-grid {
      display: grid;
      justify-content: start;
    }
    .term-row { display: contents; }

    .cell { padding: .95rem 0; }
    .cell.bt { border-top: 1px solid rgba(0,0,0,.08); }

    .term-label {
      padding-right: 1.5rem;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--bs-primary);
      white-space: nowrap;
    }

    .course {
      padding-left: 1.25rem;
      padding-right: 1.25rem;
      border-left: 1px solid rgba(0,0,0,.12);   /* 과목 사이 세로 구분선 */
      font-size: 1.05rem;
      white-space: nowrap;
    }
    .course a { color: inherit; text-decoration: none; border-bottom: 1px dotted #adb5bd; }
    .course a:hover { color: var(--bs-primary); border-bottom-color: var(--bs-primary); }

    /* 모바일: 표를 풀고 가운뎃점으로 구분 */
    @media (max-width: 575.98px) {
      .course-grid { display: block; }
      .term-row { display: block; padding: .85rem 0; }
      .term-row + .term-row { border-top: 1px solid rgba(0,0,0,.08); }
      .cell { padding: 0; border: 0 !important; }
      .term-label { display: block; font-size: .95rem; margin-bottom: .15rem; }
      .course { display: inline; padding: 0; white-space: normal; }
      .course + .course::before { content: " · "; color: #adb5bd; }
      .filler { display: none; }
    }
  </style>
</head>

<header class="bg-light text-center py-5 border-bottom">

<!-- Main : 학기별 목록이 여기에 자동으로 그려집니다 -->

<!-- ===================================================================
     학기가 바뀌면 TERMS 배열 맨 위에 한 덩어리만 추가.
       { term: "Fall 2026", courses: ["과목명", ...] }
     강의계획서를 링크하려면 문자열 대신 객체로:
       { name: "자료구조", url: "assets/files/ds-2026f.pdf" }
     과목 열 개수는 가장 많은 학기에 맞춰 자동으로 늘어납니다.
     ★ 각 속성 끝, 각 객체 끝의 쉼표(,)를 빠뜨리지 말 것
     =================================================================== -->
<script>
  const TERMS = [
    {
      term: "Fall 2026",
      courses: ["자료구조", "데이터베이스응용과 XML"]
    },
    {
      term: "Spring 2026",
      courses: ["데이터베이스", "빅데이터최신기술", "자료구조"]
    },
    {
      term: "Fall 2025",
      courses: ["데이터과학", "자료구조"]
    },
    {
      term: "Spring 2025",
      courses: ["데이터베이스", "빅데이터최신기술"]
    }
  ];
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const root = document.getElementById("courseRoot");

    // 과목 수가 가장 많은 학기에 맞춰 열 개수 결정
    const maxCourses = TERMS.reduce(function (m, t) {
      return Math.max(m, t.courses.length);
    }, 0);
    root.style.gridTemplateColumns = "max-content repeat(" + maxCourses + ", max-content)";

    TERMS.forEach(function (t, i) {
      const row = document.createElement("div");
      row.className = "term-row";
      const bt = i > 0 ? " bt" : "";   // 첫 행 위에는 선을 넣지 않음

      const label = document.createElement("div");
      label.className = "cell term-label" + bt;
      label.textContent = t.term;
      row.appendChild(label);

      t.courses.forEach(function (c) {
        const cell = document.createElement("div");
        cell.className = "cell course" + bt;
        const name = typeof c === "string" ? c : c.name;
        if (typeof c === "object" && c.url) {
          const a = document.createElement("a");
          a.href = c.url;
          a.textContent = name;
          cell.appendChild(a);
        } else {
          cell.textContent = name;
        }
        row.appendChild(cell);
      });

      // 과목 수가 적은 학기는 빈 칸으로 채워 열을 맞춤
      for (let k = t.courses.length; k < maxCourses; k++) {
        const filler = document.createElement("div");
        filler.className = "cell filler" + bt;
        row.appendChild(filler);
      }

      root.appendChild(row);
    });
  });
</script>
</body>
